<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>수업 과제 제출하기</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --primary: #2563eb;
      --border-color: #e2e8f0;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      padding: 30px 20px;
      display: flex;
      justify-content: center;
    }
    .card {
      background: #fff7ed; /* 은은한 주황색 배경 */
      border: 1px solid #fdba74;
      border-radius: var(--radius);
      box-shadow: 0 4px 12px rgba(249, 115, 22, 0.15);
      padding: 28px;
      width: 100%;
      max-width: 480px;
    }
    h2 { margin-bottom: 20px; color: #c2410c; font-size: 1.3rem; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 0.95rem; color: #9a3412; }
    input[type="text"], input[type="file"] {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 0.95rem;
      background: #ffffff;
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      background: #ea580c; /* 주황색 제출 버튼 */
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-submit:hover { background: #c2410c; }
    .btn-submit:disabled { background: #94a3b8; cursor: not-allowed; }
    #status { margin-top: 15px; font-weight: bold; text-align: center; }
  </style>
</head>
<body>

<div class="card">
  <h2>📤 수업 과제 제출함</h2>
  
  <div class="form-group">
    <label for="studentInfo">학번 및 이름</label>
    <input type="text" id="studentInfo" placeholder="예: 20901 김모락">
  </div>

  <div class="form-group">
    <label for="taskTitle">활동명 (과제 제목)</label>
    <input type="text" id="taskTitle" placeholder="예: RGB행렬실습, TFIDF분석">
  </div>

  <div class="form-group">
    <label for="fileInput">제출할 파일 선택 (다중 선택 가능)</label>
    <!-- multiple 속성 추가 -->
    <input type="file" id="fileInput" multiple>
  </div>

  <button class="btn-submit" id="submitBtn" onclick="uploadFiles()">구글 드라이브로 제출하기</button>
  <div id="status"></div>
</div>

<script>
  const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyHKCSYVm_sT-ugpOq0_GzbGOuE1Je4HxCDDBprooF09sNkTnqLsciA-JqStwBBfgeG/exec";

  // 파일을 Base64 문자열로 읽는 함수
  function readFileAsBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = error => reject(error);
      reader.readAsDataURL(file);
    });
  }

  async function uploadFiles() {
    const studentInfo = document.getElementById('studentInfo').value.trim();
    const taskTitle = document.getElementById('taskTitle').value.trim();
    const fileInput = document.getElementById('fileInput');
    const statusDiv = document.getElementById('status');
    const submitBtn = document.getElementById('submitBtn');

    if (!studentInfo) {
      alert('학번과 이름을 입력해주세요.');
      return;
    }
    if (!taskTitle) {
      alert('활동명을 입력해주세요.');
      return;
    }
    if (fileInput.files.length === 0) {
      alert('제출할 파일을 1개 이상 선택해주세요.');
      return;
    }

    const files = Array.from(fileInput.files);
    submitBtn.disabled = true;
    statusDiv.style.color = "#ea580c";
    statusDiv.innerText = `⏳ 총 ${files.length}개의 파일을 업로드 중입니다...`;

    try {
      // 선택한 파일들을 하나씩 순차적으로 전송
      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        statusDiv.innerText = `⏳ 업로드 중... (${i + 1}/${files.length}) : ${file.name}`;

        const base64Data = await readFileAsBase64(file);
        
        const payload = {
          studentInfo: studentInfo,
          taskTitle: taskTitle,
          fileName: file.name,
          fileData: base64Data,
          mimeType: file.type,
          fileIndex: files.length > 1 ? (i + 1) : 0 // 파일이 여러 개일 때만 번호 붙임
        };

        const response = await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        if (data.result !== 'success') {
          throw new Error(data.message || `${file.name} 업로드 실패`);
        }
      }

      statusDiv.style.color = "#16a34a";
      statusDiv.innerText = `✅ 총 ${files.length}개의 파일이 성공적으로 제출되었습니다!`;
      document.getElementById('fileInput').value = "";
      document.getElementById('taskTitle').value = "";

    } catch (err) {
      statusDiv.style.color = "#ef4444";
      statusDiv.innerText = "❌ 오류 발생: " + err.message;
      console.error(err);
    } finally {
      submitBtn.disabled = false;
    }
  }
</script>

</body>
</html>
