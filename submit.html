<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>수업 과제 제출하기</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
      --radius: 12px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      padding: 30px 20px;
      display: flex;
      justify-content: center;
    }
    .card {
      background: #fff7ed;
      border: 1px solid #fdba74;
      border-radius: var(--radius);
      box-shadow: 0 4px 12px rgba(249, 115, 22, 0.15);
      padding: 28px;
      width: 100%;
      max-width: 480px;
    }
    h2 { margin-bottom: 20px; color: #c2410c; font-size: 1.3rem; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 0.95rem; color: #9a3412; }
    input[type="text"], input[type="file"] {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 0.95rem;
      background: #ffffff;
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      background: #ea580c;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-submit:hover { background: #c2410c; }
    .btn-submit:disabled { background: #94a3b8; cursor: not-allowed; }
    #status { margin-top: 15px; font-weight: bold; text-align: center; font-size: 0.95rem; }
  </style>
</head>
<body>

<div class="card">
  <h2>📤 수업 과제 제출하기</h2>
  
  <div class="form-group">
    <label for="studentInfo">학번 및 이름</label>
    <input type="text" id="studentInfo" placeholder="예: 20901 김모락">
  </div>

  <div class="form-group">
    <label for="taskTitle">활동명(과제 제목)</label>
    <input type="text" id="taskTitle" placeholder="예: RGB행렬실습, TFIDF분석">
  </div>

  <div class="form-group">
    <label for="fileInput">제출할 파일 선택(다중 선택 가능)</label>
    <input type="file" id="fileInput" multiple>
  </div>

  <button class="btn-submit" id="submitBtn" onclick="uploadFiles()">구글 드라이브로 제출하기</button>
  <div id="status"></div>
</div>

<script>
  const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzANwCFZOwmgyO72ZJx_H7-WcXWtPWxQ96z48RaxGCE_ihiM2TTLY7NmLI0Qa1-K9jTzA/exec"; // 본인의 웹앱 배포 URL 입력

  function readFileAsBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = error => reject(error);
      reader.readAsDataURL(file);
    });
  }

  async function uploadFiles() {
    const studentInfo = document.getElementById('studentInfo').value.trim();
    const taskTitle = document.getElementById('taskTitle').value.trim();
    const fileInput = document.getElementById('fileInput');
    const statusDiv = document.getElementById('status');
    const scriptBtn = document.getElementById('submitBtn');

    if (!studentInfo) {
      alert('학번과 이름을 입력해주세요.');
      return;
    }
    if (!taskTitle) {
      alert('활동명을 입력해주세요.');
      return;
    }
    if (fileInput.files.length === 0) {
      alert('제출할 파일을 1개 이상 선택해주세요.');
      return;
    }

    const files = Array.from(fileInput.files);
    scriptBtn.disabled = true;
    statusDiv.style.color = "#ea580c";
    statusDiv.innerText = `⏳ 총 ${files.length}개 파일 인코딩 및 전송 준비 중...`;

    try {
      const filePayloads = await Promise.all(files.map(async (file, index) => {
        const base64Data = await readFileAsBase64(file);
        return {
          fileName: file.name,
          fileData: base64Data,
          mimeType: file.type || 'application/octet-stream',
          fileIndex: files.length > 1 ? (index + 1) : 0
        };
      }));

      statusDiv.innerText = `⏳ 드라이브 업로드 및 시트 기록 중...`;

      const payload = {
        studentInfo: studentInfo,
        taskTitle: taskTitle,
        files: filePayloads
      };

      const response = await fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });

      const data = await response.json();
      if (data.result !== 'success') {
        throw new Error(data.message || "업로드 실패");
      }

      statusDiv.style.color = "#16a34a";
      statusDiv.innerText = `✅ 총 ${files.length}개 파일 제출 및 시트 기록 완료!`;
      document.getElementById('fileInput').value = "";
      document.getElementById('taskTitle').value = "";

    } catch (err) {
      statusDiv.style.color = "#ef4444";
      statusDiv.innerText = "❌ 오류 발생: " + err.message;
      console.error(err);
    } finally {
      scriptBtn.disabled = false;
    }
  }
</script>

</body>
</html>
