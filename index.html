<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>인공지능 수학 & 수학 수업 웹앱 모음집</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --border-color: #e2e8f0;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 30px 20px;
      line-height: 1.5;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    header {
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
      color: #ffffff;
      padding: 32px 28px;
      border-radius: var(--radius);
      box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.2);
    }

    header h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    header p {
      font-size: 0.95rem;
      color: #bfdbfe;
    }

    /* 검색창 & 필터 영역 */
    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .search-input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      font-size: 0.95rem;
      outline: none;
      box-shadow: var(--shadow);
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--primary);
    }

    /* 카드 그리드 레이아웃 */
    .app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .app-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .app-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.1);
    }

    .card-header {
      margin-bottom: 12px;
    }

    .card-badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      background: #eff6ff;
      color: var(--primary);
      margin-bottom: 8px;
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .card-desc {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .card-btn {
      margin-top: 16px;
      display: inline-block;
      text-align: center;
      background: var(--primary);
      color: #ffffff;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s;
    }

    .card-btn:hover {
      background: var(--primary-hover);
    }

    /* 푸터 및 이메일 링크 스타일 수정 */
    footer {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-top: 20px;
    }

    .email-link {
      color: var(--text-muted);
      text-decoration: none !important; /* 밑줄 완벽 제거 */
      font-weight: 600;
      transition: color 0.2s;
    }

    .email-link:hover {
      color: var(--primary); /* 마우스 올렸을 때만 파란색으로 포인트 */
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>📐 수업용 웹앱 도구 모음집</h1>
    <p>수업 시간에 직접 실습하고 탐구해 볼 수 있는 인터랙티브 웹앱들입니다. 2026 모락고 <인공지능 수학> 과목을 수업 활용을 위해 최적화 되었습니다.</p>
  </header>

  <!-- 검색 영역 -->
  <div class="controls">
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 웹앱 이름이나 키워드로 검색해보세요..." oninput="filterApps()">
  </div>

  <!-- 앱 카드가 들어가는 공간 -->
  <div class="app-grid" id="appGrid"></div>

  <footer>
    <p>© 모락고등학교 수학 교사 김솔(<a href="mailto:ssol32@korea.kr" class="email-link">ssol32@korea.kr</a>)</p>
  </footer>
</div>

<script>
  // --------------------------------------------------
  // 🚀 앞으로 새로운 웹앱을 만들 때마다 아래 목록에 추가하면 끝!
  // --------------------------------------------------
  const apps = [
    {
      badge: "인공지능 수학",
      title: "🎨 RGB 행렬 시각화",
      desc: "2x2, 3x3, 10x10 행렬을 직접 조작하며 RGB 색상 채널 조합 및 이미지 합성 원리를 탐구합니다.",
      url: "https://5ol29.github.io/sol/rgb.html"
    },
    {
      badge: "인공지능 수학",
      title: "🔤 TF-IDF 텍스트 분석기",
      desc: "단어 빈도와 역문서 빈도를 계산하여 문서 내 주요 키워드 추출 원리를 학습합니다.",
      url: "https://5ol29.github.io/sol/textdata.html"
    },
    {
      badge: "과제 제출",
      title: "📤 실습 파일 제출하기",
      desc: "수업 결과물 파일이나 탐구 보고서를 선생님 구글 드라이브로 바로 제출합니다.",
      url: "https://5ol29.github.io/sol/submit.html"
    }
  ];

  function renderApps(list) {
    const grid = document.getElementById('appGrid');
    grid.innerHTML = '';

    if (list.length === 0) {
      grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px 0;">검색 결과가 없습니다.</p>';
      return;
    }

    list.forEach(app => {
      const card = document.createElement('div');
      card.className = 'app-card';

      // 🍊 '실습 파일 제출함' 카드만 주황색 스타일 적용
      if (app.url.includes('submit.html') || app.badge === '과제 제출') {
        card.style.background = '#fff7ed';       /* 은은한 주황색 배경 */
        card.style.borderColor = '#fdba74';      /* 주황색 테두리 */
        card.style.boxShadow = '0 4px 12px rgba(249, 115, 22, 0.15)';

        card.innerHTML = `
          <div class="card-header">
            <span class="card-badge" style="background: #ffedd5; color: #ea580c;">${app.badge}</span>
            <h2 class="card-title" style="color: #c2410c;">${app.title}</h2>
            <p class="card-desc" style="color: #9a3412;">${app.desc}</p>
          </div>
          <a href="${app.url}" class="card-btn" style="background: #ea580c;" target="_self">제출하러 가기 ➔</a>
        `;
      } else {
        // 일반 웹앱 카드
        card.innerHTML = `
          <div class="card-header">
            <span class="card-badge">${app.badge}</span>
            <h2 class="card-title">${app.title}</h2>
            <p class="card-desc">${app.desc}</p>
          </div>
          <a href="${app.url}" class="card-btn" target="_self">실습하러 가기 ➔</a>
        `;
      }

      grid.appendChild(card);
    });
  }

  function filterApps() {
    const query = document.getElementById('searchInput').value.toLowerCase();
    const filtered = apps.filter(app => 
      app.title.toLowerCase().includes(query) || 
      app.desc.toLowerCase().includes(query) ||
      app.badge.toLowerCase().includes(query)
    );
    renderApps(filtered);
  }

  // 초기 로드
  renderApps(apps);
</script>

</body>
</html>
