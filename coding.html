<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML 코딩 & 제출 파일 생성기</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .code-textarea {
            font-family: 'Courier New', Courier, monospace;
            tab-size: 4;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 h-screen w-screen flex flex-col overflow-hidden">

    <!-- 상단 헤더 -->
    <header class="bg-slate-800 border-b border-slate-700 px-6 py-3 flex items-center justify-between shrink-0">
        <div class="flex items-center space-x-3">
            <div class="bg-indigo-600 text-white p-2 rounded-lg font-bold">
                <i class="fa-solid fa-code"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold tracking-tight">HTML 실시간 에디터</h1>
                <p class="text-xs text-slate-400">코드를 작성하고 느낀점이 포함된 파일로 저장하세요.</p>
            </div>
        </div>
        
        <!-- 학번, 이름 입력 & 저장 버튼 -->
        <div class="flex items-center space-x-3">
            <input type="text" id="student-id" placeholder="학번 (예: 20901)" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 w-32">
            <input type="text" id="student-name" placeholder="이름 (예: 김모락)" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 w-28">
            <button onclick="downloadCombinedHtml()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold px-4 py-1.5 rounded-lg text-sm transition flex items-center space-x-2 shadow">
                <i class="fa-solid fa-download"></i>
                <span>파일 저장하기</span>
            </button>
        </div>
    </header>

    <!-- 메인 콘텐츠 영역 -->
    <main class="flex-1 overflow-hidden p-4 flex flex-col lg:flex-row gap-4">

        <!-- 좌측: HTML 코드 에디터 -->
        <div class="w-full lg:w-1/2 flex flex-col h-full">
            <div class="flex-1 bg-slate-800 border border-slate-700 rounded-xl flex flex-col shadow-lg overflow-hidden">
                <div class="bg-slate-750 px-4 py-2.5 border-b border-slate-700 flex items-center justify-between">
                    <span class="text-xs font-semibold text-slate-300 flex items-center space-x-2">
                        <i class="fa-brands fa-html5 text-orange-400"></i>
                        <span>HTML 소스 코드</span>
                    </span>
                    <div class="flex items-center space-x-2">
                        <button onclick="loadSampleCode()" class="text-xs text-slate-300 hover:text-white bg-slate-700 hover:bg-slate-600 px-2.5 py-1 rounded transition">예시 코드</button>
                        <button onclick="clearCode()" class="text-xs text-slate-300 hover:text-red-400 bg-slate-700 hover:bg-slate-600 px-2.5 py-1 rounded transition">초기화</button>
                    </div>
                </div>
                <textarea id="html-code" oninput="updatePreview()" class="flex-1 bg-slate-900 p-4 text-sm text-emerald-400 code-textarea focus:outline-none resize-none" placeholder="HTML 코드를 입력하세요..."></textarea>
            </div>
        </div>

        <!-- 우측: 실시간 미리보기 및 하단 느낀점 입력 영역 -->
        <div class="w-full lg:w-1/2 flex flex-col gap-4 h-full overflow-y-auto lg:overflow-visible">
            <!-- 실시간 미리보기 -->
            <div class="flex-1 bg-slate-800 border border-slate-700 rounded-xl flex flex-col shadow-lg overflow-hidden min-h-[250px]">
                <div class="bg-slate-750 px-4 py-2.5 border-b border-slate-700 flex items-center justify-between">
                    <span class="text-xs font-semibold text-slate-300 flex items-center space-x-2">
                        <i class="fa-solid fa-desktop text-indigo-400"></i>
                        <span>실시간 미리보기</span>
                    </span>
                    <button onclick="openNewWindow()" class="text-xs text-slate-300 hover:text-white bg-slate-700 hover:bg-slate-600 px-2.5 py-1 rounded transition flex items-center space-x-1">
                        <i class="fa-solid fa-arrow-up-right-from-square"></i>
                        <span>새 창에서 보기</span>
                    </button>
                </div>
                <div class="flex-1 bg-white relative">
                    <iframe id="preview-frame" class="w-full h-full border-0"></iframe>
                </div>
            </div>

            <!-- 수업 느낀점 입력 영역 (태블릿 환경 최적화: 크기 확장 & 조절 가능) -->
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-lg shrink-0">
                <label class="block text-sm font-semibold text-slate-200 mb-2 flex items-center space-x-1.5">
                    <i class="fa-solid fa-comment-dots text-indigo-400"></i>
                    <span>이번 시간 느낀 점이나 배운 점, 더 해보고 싶은 것?</span>
                </label>
                <textarea id="student-reflection" rows="5" placeholder="오늘 실습을 통해 느낀 점이나 배운 내용을 작성해 주세요." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 resize-y min-h-[120px] leading-relaxed"></textarea>
            </div>
        </div>

    </main>

    <!-- JS 로직 -->
    <script>
        const defaultCode = `<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>나의 첫 웹페이지</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; text-align: center; padding-top: 40px; background-color: #f8fafc; color: #334155; }
        h1 { color: #2563eb; }
        p { color: #64748b; }
    </style>
</head>
<body>
    <h1>안녕하세요! 👋</h1>
    <p>이곳은 내가 직접 만든 첫 번째 웹페이지입니다.</p>
</body>
</html>`;

        window.onload = function() {
            document.getElementById('html-code').value = defaultCode;
            updatePreview();
        };

        // 실시간 미리보기
        function updatePreview() {
            const code = document.getElementById('html-code').value;
            const iframe = document.getElementById('preview-frame');
            const blob = new Blob([code], { type: 'text/html;charset=utf-8' });
            iframe.src = URL.createObjectURL(blob);
        }

        function loadSampleCode() {
            document.getElementById('html-code').value = defaultCode;
            updatePreview();
        }

        function clearCode() {
            if (confirm('작성 중인 코드를 초기화하시겠습니까?')) {
                document.getElementById('html-code').value = '';
                updatePreview();
            }
        }

        function openNewWindow() {
            const code = document.getElementById('html-code').value;
            const win = window.open();
            win.document.write(code);
            win.document.close();
        }

        // 통합 HTML 파일 생성 및 저장 기능 (결과물 상단 + 느낀점 하단 배치)
        function downloadCombinedHtml() {
            const studentId = document.getElementById('student-id').value.trim();
            const studentName = document.getElementById('student-name').value.trim();
            const reflection = document.getElementById('student-reflection').value.trim();
            const userCode = document.getElementById('html-code').value;

            if (!studentId || !studentName) {
                alert('파일을 저장하려면 학번과 이름을 꼭 입력해 주세요!');
                document.getElementById('student-id').focus();
                return;
            }

            // 느낀점 줄바꿈 처리
            const formattedReflection = reflection ? reflection.replace(/\n/g, '<br>') : '작성된 느낀점이 없습니다.';

            // 다운로드 파일 내부 구조: 결과물이 먼저 나오고, 느낀점이 아래쪽에 배치되도록 수정
            const finalHtmlContent = `<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${studentId}_${studentName} 학생의 실습 제출물</title>
